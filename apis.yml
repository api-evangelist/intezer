aid: intezer
name: Intezer
description: >-
  Intezer operates a Forensic AI SOC platform that autonomously triages, investigates
  and helps respond to every security alert flowing from an organization's EDR, NDR,
  SIEM, identity, cloud and email-security tooling. Its investigation engine combines
  Genetic Malware Analysis (code-reuse mapping against a large genome of trusted and
  malicious software), dynamic and static analysis, memory forensics, sandboxing and
  agentic AI reasoning to reach a verdict on alerts in under two minutes. The Intezer
  Platform API 2.0 exposes this analysis surface programmatically — submitting files,
  URLs, hashes and endpoint scans for analysis, retrieving verdicts and code-reuse
  results, and querying IOCs — and is offered alongside an official Python SDK, a CLI,
  and an MCP server that connects AI agents such as Claude, Cursor and Codex to case
  histories and investigation context.
